global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'personalize-u'
    environment: 'local'

scrape_configs:
  - job_name: 'personalize-web'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
